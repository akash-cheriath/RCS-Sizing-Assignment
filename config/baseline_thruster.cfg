# This file contains the baseline configuration of the RCS thruster class used in the study. 

# Definitions used here:
# a. Clock angle : Angular position of the thruster pods around the symmetical roll (X) axis of the vehicle,
#                  in the Y-Z plane, measured from the +Y axis towards +Z direction in the body frame of the vehicle.
#                  When seen from the nose of the vehicle, the +Y axis is to the right and the +Z axis points upwards
#                  The clock angle is measured in the counter-clockwise direction from the +Y axis towards the +Z axis.     
# b. Cant angle  : The outward tilt of the nozzle away from the capsule surface from its "pure" direction (axial direction)
#                  along the axis for AFT/FWD/NOSE, tangential (+Z-axis) for the ROLL.
#                  Useful thrust = cos(cant_angle) * thrust, where thrust is the nominal thrust of the thruster class;
#                  The sin(cant_angle) * thrust is the thrust component cancels against the opposite pod's thrust component,
#                  but helps in moving the plume away from the wall, service module or the station.

baseline_layout     = Q24               # Chosen from CM12/Q16/Q20/Q24/Q32/D16
thrust              = 216.0             # [N] Nominal thrust of the thruster class (ArianeGroup 200 N bipropellant thruster)
isp_steady          = 272               # [s] 
isp_pulse           = 245               # [s] ~90% of steady state isp, for short duration pulses
min_pulse_time      = 28                # [ms] Minimum pulse duration for the thruster


pod_x_pos       = 0.10                  # [m] axial positions of the pods from the origin along the +X axis of the vehicle body frame

# For double ring layouts :
ring_behind_cog_x = 0.08                # [m] Ring "behind the CoG"
ring_front_cog_x  = 1.50                # [m] Ring "in front of the CoG"

pod_clock0      = 45.00                 # [deg] clock angle of the first pod in the +Y to +Z plane

cant_fwd        = 20.00                 # [deg] cant angle of the forward firing thrusters (towards the nose of the vehicle), but pluming
                                        # away from the docking target
cant_aft        = 30.00                 # [deg] cant angle of the aft firing thrusters (towards the heatshield of the vehicle)
cant_roll       = 10.00                 # [deg] small cant angle to keep plume off the wall

main_burn_throttle = 0.90               # [-] Main burns (orbit raise, deorbit) use 90 % of the largest pure -X force;
                                        # 10 % stays free for attitude control during the burn (judgement)
