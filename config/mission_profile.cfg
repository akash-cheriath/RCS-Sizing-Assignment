# This file contains the details of the mission profile used in the study. The mission profile is a 
# sequence of maneuvers that the vehicle will perform during its operation. Each maneuver is defined 
# by its relevant parameters.

# --------------------- LAUNCH, INSERTION AND DETUMBLE ----------------------
# The launch vehicle selected is Ariane 64 that inserts the vehicle into a 200 km circular orbit at 51.6 deg inclination.
# The vehicle needs to be detumbled to a low angular velocity state. Also, there might be dispersions in this insertion
# condition that might also be needed to be corrected by the capsule's RCS system. 

h_insertion             = 200.0          # [km] Altitude of the circular orbit after insertion
inclination             = 51.6           # [deg] Inclination of the circular orbit after insertion
dispersion_h            = 7.5            # [km] 3-sigma altitude error (Source: Ariane 64 User Manual, 2020)
dispersion_inc          = 0.12           # [deg] 3-sigma inclination error (Source: Ariane 64 User Manual, 2020)
dispersion_raan         = 0.09           # [deg] 3-sigma RAAN error (Source: Ariane 64 User Manual, 2020)

tipoff_rate             = 2.0            # [deg/s] Approximate value calculated from available data (Source: Ariane 64 User Manual, 2020)
detumble_time           = 60.0           # [s] Assumption based on the nose cone opening time of Dragon capsule (Source: NASA SpaceX Crew 12 mission)
detumble_pulse_factor   = 1.5            # [-] Propellant of real pulsing / ideal angular impulse (judgement)

# ---------------- PHASING AND RENDEZVOUS (200 km -> 400 km) ----------------
h_target                = 400        # [km] Target orbit (here ISS orbit)
phase_angle             = 200        # [deg] Requirement based on CCT-REQ-1130 Rev F is 190 degree for 24 h docking
                                     # At 200 km, the capsule gains around 204 deg in 19 h (rest 5 h allocated for fixed operations)
tpi_mcc_v_null_dv       = 1.12       # [m/s] Source: Literature on Orion
dispersion_terminal_dv  = 14.7       # [m/s] Source: Literature on Orion
debris_avoid_mnvr_count = 2          # [-] As per NASA, around 3.5-40 "red events" per year for size of the capsule. Rounding off the 
                                     # value to next integer and multiplying it by factor of 2 based on ESA dv guidance
debris_avoid_mnvr_dv    = 0.5        # [m/s] each

# -------------------- PROXIMITY OPERATIONS AND DOCKING ---------------------
wp0_below_trgt_rbar     = 400.0      # [m] Waypoint 0 : hold below the station on R-bar (Similar to Dragon)
wp0_hold                = 30         # [min] Conservative hold duration at WP0 (Based on timeline followed by Crew-2)
wp1_vbar                = 220.0      # [m] Waypoint 1 : hold on +V-bar (forward port)
wp1_hold                = 10         # [min] Conservative value
wp2_vbar                = 20.0       # [m] Waypoint 2 : hold on +V-bar (forward port)
wp2_hold                = 10         # [min] Conservative value

wp0_1_orbit_frac        = 0.30       # [revs] The fraction of orbit target station covers while chaser moves from WP0 to WP1
approach_speed_far      = 0.20       # [m/s] Conservative closing speed based on Crew Dragon and course learning at University
approach_speed_near     = 0.10       # [m/s] Allowed maximum closing speed based on Requirement, Crew Dragon and course learning at University
contact_speed           = 0.08       # [m/s] Allowed maximum closing speed based on Requirement document IDSS IDD
approach_switch_range   = 100.0      # [m] Range where the V-bar approach slows from the far to the near speed (Judgement)
wp1_hold_dv             = 0.1        # [m/s] Station-keeping allowance at WP1 (+V-bar is a natural equilibrium)
wp2_hold_dv             = 0.1        # [m/s] Station-keeping allowance at WP2
capture_push_dv         = 0.1        # [m/s] Thrust after contact to keep the capture latches closing
proxops_allowance       = 0.5        # [-] Extra prox-ops dv for pulsing, navigation noise and cross-coupling (50 %, Judgement)

kos_radius              = 200        # [m] ISS Keep-out-sphere radius as per Requirement document IRSIS
app_corridor_half_angle = 10         # [deg] Approach corridor half angle as per Requirement document IRSIS
kos_margin_min          = 0.10       # [-] Closest approach outside the KOS should keep >= 10 % margin, else FLAG (Judgement)
passive_safety_time     = 24         # [h] A trajectory with a missed burn must not enter the KOS within this time
                                     #     (judgement, the same 24 h as the departure check of the full project)

# Ensuring fine control during contact
dock_ang_rate_max       = 0.20       # [deg/s] Requirement document IDSS contact limit
dock_lat_rate_max       = 0.04       # [m/s] IDSS contact limit on the lateral rate (one minimum sideways pulse <= mib_tol of it)
mib_tol                 = 0.25       # [-] Denotes the minimum impulse bit (= thrust * min_on_time) tolerance that can be used by one
                                     # thruster. Selected 25 % based on the study made by NASA (Bailey et al.) studying handling qualities
                                     # during docking

# Addressing contingencies near the station
cam_dv                  = 1.5        # [m/s] Indicates collision avoidance maneuver speed. A posigrade CAM from +V-bar results in capsule
                                     # initially moving away and rising. The moment when the capsule is directly above the station, using 
                                     # CW equations, the vertical distance from station ~1.417 (delta-v) / n. The chosen velocity ensures
                                     # ~ 1600 m separation in collision avoidance scenarios.
cam_time                = 30         # [s] Assumed value for 2 thrusters failed case so that average deceleration of 0.05 m/s^2
cam_count               = 2          # number of CAMs budgeted (expected = 1, applied with ESA debris avoidance dv margin)
reapproach_dv           = 3.5        # [m/s] Additional delta-v incurred if reapproach after moving back to WP1 is attempted.
                                     # Additional delta-v = 0.2 (start) + 0.45 (2nvt) + 0.2 (stop) + 0.1 (allowance for correction at WP1)
                                     # + Approach (2nvt coming due to extra effort by controller + 0.2 + 0.1 + 0.1 stop at WP2) + 0.1 + 2nvt
                                     # + contact speed + 0.1 (additional push to keep the latches closing)
rerendezvous_dv         = 15.0       # [m/s] Similar approximations as above

# -------------------------- UNDOCKING AND DEPARTURE --------------------------
undock_push_dv          = 0.1        # [m/s]
dep_corridor_angle      = 20         # [deg]
dep_burn0_dv            = 0.60       # [m/s] Smallest average speed required to safely move out of KOS
dep_burn1_dv            = 0.60       # [m/s] Assumed to be same as Departure Burn 0 value
dep_burn0_time          = 60         # [s] DB0 one minute after the push
dep_burn1_time          = 600        # [s] DB1 ~10 min later, outside the KOS
undock_start_range      = 2.0        # [m] Distance from the docking port when the push is complete
departure_dv            = 2.5        # [m/s] Allowing allowance and possibility of further depature burns like Crew Dragon

# ------------------- DEORBIT AND SERVICE MODULE SEPARATION -------------------
deorbit_phasing_dv      = 10         # [m/s] Allowance provided
perigee_target          = 40         # [km]
deorbit_burn_max        = 15         # [min] Nominal burn-time limit (nearly same as Crew 11)
deorbit_burn_max_1f     = 20         # [min] Burn-time limit with one failed thruster
deorbit_burn_max_2f     = 30         # [min] Burn-time limit with two failed thrusters
srvc_mod_sep_dv         = 2.0        # [m/s] Assumed capsule raise maneuver delta-v

# ---------------------------------- REENTRY -----------------------------------
alpha_trim              = 12         # [deg] based on Crew Dragon study by Trevino
roll_rate_max           = 15         # [deg/s] Vehicle property
bank_reversal           = 120        # [deg] Design reversal (+60 -> -60) - Conservative sizing
bank_reversal_time      = 12         # [s] 
bank_reversal_time_2f   = 15         # [s]
bank_reversal_count     = 6          # [-] Number of reversals budgeted (Artemis 1 value)
entry_rate_damping      = 15         # [kg] Entry rate damping allowance (Apollo used 12-23 kg in entry)

# -------------- ATTITUDE CONTROL IN FREE FLIGHT (all phases) -------------------
deadband                = 1.0        # [deg] Attitude deadband in free flight
slew_count              = 40         # [-] Number of large attitude maneuvers in the mission including the 180 yaw turn
slew_rate               = 1.0        # [deg/s]
free_flight_time        = 100        # [hours] Approximate value from CCT-REQ-1130 Rev F along with undocking -> landing time (~27h)