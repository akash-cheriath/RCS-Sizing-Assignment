# -------------------------- RCS THRUSTERS CLASSES --------------------------
# These are RCS thruster classes investigated in the study.

# Format of each entry:
# class_<option> = F=<thrust in Newtons> isp=<isp in seconds> isp_pulse=<isp in seconds>  
#                  t_min=<minimum_time in ms> available=<True/False> (in market for sale)  # [optional comment]

class_A = F=111 isp=280 isp_pulse=252 t_min=8 available=True    # 25-lbf biprop, L3Harris R-1E (Shuttle vernier, HTV)
class_B = baseline                            available=True    # Baseline class - information in baseline_thruster.cfg
class_C = F=400 isp=300 isp_pulse=270 t_min=20 available=False  # 400 N biprop, Draco class
class_D = F=400 isp=212 isp_pulse=191 t_min=16 available=True   # 400 N hydrazine, ArianeGroup Monopropellant
class_E = F=400 isp=318 isp_pulse=286 t_min=16 available=True   # 400 N bipropellant ArianeGroup

# The below values are used for trade-study on the axial position of the thruster pods along the +X axis of the vehicle body frame
pod_x_min       = 0.08                  # [m] minimum axial position of the pods from the origin along the +X axis of the vehicle body frame
pod_x_max       = 0.24                  # [m] maximum axial position of the pods from the origin along the +X axis of the vehicle body frame
pod_trade_step  = 0.02                  # [m] step size for the pod axial position trade study

# The below values are used for trade-study on the axial position of the thruster pods along the +X axis of the vehicle body frame for double
# ring architectures
front_ring_x_min  = 0.24                # [m] minimum axial position of the pods from the origin along the +X axis of the vehicle body frame
front_ring_x_max  = 2.40                # [m] maximum axial position of the pods from the origin along the +X axis of the vehicle body frame
front_ring_x_step = 0.10                # [m] step size for the pod axial position trade study
run_geometry_sweeps = yes               # yes | no

# The below values are for the RCS thrusters that are present on the nose of the capsule for the dragon-like arrangements
nose_thr_x      = 3.2                   # [m]
nose_thr_radius = 0.75                  # [m]

# The below angle values are used for the trade-study of the cant angles of the thruster pods. 
cant_trade_fwd_min  = 0.00              # [deg] 
cant_trade_fwd_max  = 30.00             # [deg]
cant_trade_aft_min  = 20.00             # [deg]
cant_trade_aft_max  = 45.00             # [deg]
cant_trade_roll_min = 0.00              # [deg]
cant_trade_roll_max = 30.00             # [deg]
cant_trade_step     = 5.00              # [deg] step size for the cant angle trade study
cant_fwd_min_plume  = 20.00             # [deg] smallest forward cant that keeps the plume off the docking target (judgement until a plume analysis exists;
sweep_clear_gain    = 0.02              # [-]   a swept value replaces the config value only if its thrust window is >= 2 % wider or it needs >= 2 % less propellant
