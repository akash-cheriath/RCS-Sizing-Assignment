# Propellant Margin - based on ESA documents

dv_margin       = 0.05              # [-] on calculated delta-v (orbit raise, deorbit)
attitude_prop   = 1.0               # [-] on all attitude-control propellant 
prop_residual   = 0.03              # [-] unusable + gauging uncertainty

# Design Margins
mass_prop_margin    = 1.0           # [-]   Phase-A inertia margin, healthy cases
failure_case_margin = 0.25          # [-]   inertia margin in failure cases
authority_margin    = 2.0           # [-]   control torque >= margin x disturbance torque